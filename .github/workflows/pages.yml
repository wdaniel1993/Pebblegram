# Deploy the self-hosted settings page (pgjs/config.html) to GitHub Pages.
#
# Replaces the legacy Jekyll Pages builder, which got wedged in a zombie
# build queue (stuck "building" for hours, blocking all subsequent builds).
# Actions-based Pages: fully controllable via CLI (run/rerun/cancel/logs).
name: Deploy static content to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Serve the whole repo tree (same layout legacy Pages used);
          # .nojekyll at root keeps it a plain static copy.
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
